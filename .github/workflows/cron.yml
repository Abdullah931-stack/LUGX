# ---------------------------------------------------------------------------
# Scheduled Maintenance Cron Workflows
#
# Remediates:
# - LUGX-096: Separate jobs so purge failure never blocks reservation expiry;
#   reconciled comments; --fail-with-body; backlog drain loop.
# - TD-02: Automated expiry of stale AI reservations held past TTL.
# - Soft-delete tombstone purge (30-day retention).
#
# Setup:
#   1. Add CRON_SECRET to repository Secrets (Settings > Secrets > Actions).
#   2. Add DEPLOY_URL to repository Secrets or Variables (e.g. https://your-app.com).
# ---------------------------------------------------------------------------
name: Cron — Scheduled Maintenance

on:
  schedule:
    # Daily at 03:00 UTC
    - cron: "0 3 * * *"
  # Manual trigger for catch-up runs, testing, or operator interventions
  workflow_dispatch:

jobs:
  purge-deleted:
    name: Purge expired tombstones
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Drain soft-deleted retention backlog
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL || vars.DEPLOY_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$DEPLOY_URL" ]; then
            echo "ERROR: CRON_SECRET or DEPLOY_URL not configured."
            echo "Add CRON_SECRET to repository Secrets, and DEPLOY_URL to Secrets or Variables."
            exit 1
          fi

          MAX_BATCHES=10
          BATCH_NUM=1

          while [ $BATCH_NUM -le $MAX_BATCHES ]; do
            echo "--- Executing Purge Batch $BATCH_NUM / $MAX_BATCHES ---"
            
            RESPONSE=$(curl -sS -w "\n__HTTP__%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$DEPLOY_URL/api/cron/purge-deleted" || true)

            HTTP_CODE=$(echo "$RESPONSE" | tail -1 | sed 's/__HTTP__//')
            BODY=$(echo "$RESPONSE" | sed '$d')

            echo "HTTP Status: $HTTP_CODE"
            echo "Response Body: $BODY"

            if [ "$HTTP_CODE" != "200" ]; then
              echo "ERROR: Purge endpoint returned HTTP $HTTP_CODE"
              exit 1
            fi

            if echo "$BODY" | grep -q '"done":true'; then
              echo "Retention backlog fully drained on batch $BATCH_NUM."
              break
            fi

            BATCH_NUM=$((BATCH_NUM + 1))
          done

  expire-reservations:
    name: Expire stale AI reservations (TD-02)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Run expire reservations sweeper
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL || vars.DEPLOY_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$DEPLOY_URL" ]; then
            echo "ERROR: CRON_SECRET or DEPLOY_URL not configured."
            exit 1
          fi

          RESPONSE=$(curl -sS -w "\n__HTTP__%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$DEPLOY_URL/api/cron/expire-reservations" || true)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1 | sed 's/__HTTP__//')
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Response Body: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: expire-reservations endpoint returned HTTP $HTTP_CODE"
            exit 1
          fi
